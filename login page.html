<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCart Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-frame">
        <header class="logo">
            <img src="logo.png" alt="FlashCart Logo">
            <h1>FlashCart</h1>
            <p>Everything you need, in one cart</p>
        </header>

        <main class="login-box">
            <h2>Sign In</h2>

            <form id="signInForm">
                <label for="email">Email or mobile number:</label>
                <input id="email" name="email" type="text" placeholder="Enter your email or phone number">

                <label for="password">Password:</label>
                <input id="password" name="password" type="password" placeholder="Enter your password">

                <button class="sign-in-button" type="submit">Sign In</button>
            </form>

            <hr>
            <p class="help">New to FlashCart?</p>
            <button class="create-account" id="createAccount" type="button">Create your FlashCart account</button>
            <p id="message" role="status"></p>
        </main>
    </div>

    <footer>
        <p class="terms">
            By continuing, you agree to FlashCart's
            <a href="#terms">Terms of Use</a> and
            <a href="#privacy">Privacy Notice</a>.
        </p>
        <p class="copyright">© 2026 FlashCart. All rights reserved.</p>
    </footer>
    <script>
        document.getElementById("signInForm").addEventListener("submit", function (event) {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!email || !password) {
                event.preventDefault();

                if (!email && !password) {
                    alert("Please enter your email or mobile number and password.");
                } else if (!email) {
                    alert("Please enter your email or mobile number.");
                    document.getElementById("email").focus();
                } else {
                    alert("Please enter your password.");
                    document.getElementById("password").focus();
                }
            }
        });
    </script>
</body>

</html>
