<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FlashCart Products</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <header>
    <nav>
        <div class="logo">
                <img src="Images/flashcart-logo-premium.png" alt="FlashCart Logo">
                <span>FlashCart</span>
            </div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <button id="cart-btn">Cart (0)</button>
    </nav>
   </header> 

   <main>
        <section class="products">
            <h2>Our Products</h2>
            <div class="category-bar" id="category-bar"></div>
            <div class="grid" id="product-grid"></div>
        </section>
   </main>

   <div class="cart-panel" id="cart-panel">
        <div class="cart-head">
            <h3>Your Cart</h3>
            <button id="cart-close">X</button>
        </div>
        <div id="cart-items"></div>
        <div class="cart-foot">
            <p>Total Amount: <span id="cart-total">₹0</span></p>
            <button id="buy-btn">Buy Now</button>
        </div>
   </div>

   <script src="products.js"></script>
    </body>
</html>
