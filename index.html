<html>
<head>
    <title>FlashCart The Next Gen Shopping Experience</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loader">
        <div class="loader-glow"></div>
        <div class="glass-slab">
            <img src="Images/flashcart-logo-premium.png" alt="FlashCart Logo">
            <h1>FlashCart</h1>
        </div>
    </div>
   <header>
    <nav>
        <div class="logo">
                <img src="Images/flashcart-logo-premium.png" alt="FlashCart Logo">
                <span>FlashCart</span>
            </div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <button>Cart (0)</button>
    </nav>
   </header> 
   <script>
        window.addEventListener('load',function(){
            setTimeout(function(){
                document.getElementById("loader").classList.add("hide");
        },5000);
    });
   </script>
</body>
</html>
